# PathFinder default configuration. Every tunable lives here, not in code.

paths:
  # Existing inputs (reused, never modified)
  h5_root: /path/to/your/cohort   # see README: private cohort, not distributed
  features_root: /path/to/your/cohort   # see README: private cohort, not distributed
  wsi_root: /path/to/your/cohort   # see README: private cohort, not distributed
  # Project outputs
  metadata_csv: metadata/slides.csv
  embeddings_dir: artifacts/embeddings  # {slide_id}.npz  (embeddings [N,D] float32, coords [N,2] int32)
  candidates_dir: artifacts/candidates  # {slide_id}.npz
  thumbnails_dir: artifacts/thumbnails  # demo only
  results_dir: results

labels:
  # class directory name -> integer label (configurable mapping, README section 3)
  class_0: Invalid      # non-responder
  class_1: Effective    # responder
  class_names: {0: "non-responder (Invalid)", 1: "responder (Effective)"}

encoder:
  name: uni             # encoder of the HISTORICAL research runs recorded in results/ (UNI, CC-BY-NC-ND-4.0).
                        # Hackathon demos use hoptimus0 (configs/aws_demo.yaml, Apache-2.0); see src/encoders/registry.py

embeddings:
  l2_normalize: true    # source features are already unit-norm; kept explicit

candidate_selection:
  num_clusters: 32
  kmeans_n_init: 3
  seed: 0

knn:
  k: 15
  metric: cosine
  bank: candidates      # KNN reference bank = candidate prototypes of training slides

decider:
  backend: strands      # strands | threshold (deterministic ablation policy)
  model_id: StrandsAgents/strands-decider-2B-qwen3.5-v1-2610
  device: cuda
  min_selected: 6
  target_selected: 12
  max_selected: 16
  low_confidence_threshold: 0.2   # 3-option confidence = (3*p_max - 1)/2; 0.2 <=> p_max < 0.47
  low_confidence_action: SKIP
  candidate_order: priority   # priority (vote_confidence x representativeness, desc) | random
  weak_remaining_threshold: 0.3   # "remaining_candidates_are_weak" when max remaining priority < this
  question: "Which action should the evidence-selection agent take for this candidate?"
  criteria:                   # option descriptions shown to the Decider (the explicit policy)
    SELECT: "evidence_strength is at least 0.5 and novelty_vs_selected_evidence is at least 0.4: strong, non-redundant evidence worth adding"
    SKIP: "evidence_strength is below 0.5 or novelty_vs_selected_evidence is below 0.4: weak or redundant, do not add"
    STOP: "target_budget_reached is true and remaining_candidates_are_weak is true: the evidence set is complete, stop searching"
  threshold_policy:           # used only when backend == threshold
    select_min_vote_confidence: 0.2
    select_min_novelty: 0.15
    stop_min_novelty_seen: 0.1

aggregation:
  pooling: mean         # mean | weighted_mean (ablation)

classifier:
  type: logistic_regression
  C: 1.0
  standardize: true
  pca_components: 0     # 0 = off; if >0, PCA is fit on the training fold only

evaluation:
  folds: 5
  seeds: [0, 1, 2, 3, 4]
  random_k_repeats: 5

bedrock:
  model_id_env: BEDROCK_MODEL_ID
  region_env: AWS_REGION
  max_tokens: 600

# ---------------- V2: sequential active patch acquisition (docs/WP/WP001.md) ----------------
acquisition:
  candidate_pool_size: 128      # KMeans clusters on CHEAP features (64 / 128 / 256 for ablation)
  seed: 0
  shortlist_size: 4
  min_uni_calls: 8
  target_uni_calls: 16
  max_uni_calls: 32
  low_confidence_threshold: 0.15   # 5-option confidence = (5*p_max - 1)/4; fallback = best cheap score
  diverse_similarity_threshold: 0.55  # acquired_evidence_is_diverse when mean pairwise UNI cosine < this
  spatial_coverage_radius: 0.08       # pool candidates within this normalised distance of an acquired patch count as covered
  budgets: [4, 8, 16, 32, 64]         # fixed-budget baselines and the budget curve
  router_backend: strands             # strands | heuristic
  stop_mode: separate                 # separate: route question (A-D) + halt question (CONTINUE/STOP) per round | joint: A-D+STOP in one choice
  halt_question: "Should the agent stop acquiring UNI patches now, or continue with one of the shortlisted candidates?"
  halt_criteria:
    CONTINUE: "target_budget_reached is false or acquired_evidence_is_diverse is false: keep acquiring evidence"
    STOP: "target_budget_reached is true and acquired_evidence_is_diverse is true: enough evidence has been collected, stop spending UNI compute"
  question: "Which candidate should receive the next expensive UNI inference? Prefer a candidate that is novel and far from the evidence acquired so far, representative of a large unexplored tissue region, and rich in tissue content."
  stop_criterion: "target_budget_reached is true and acquired_evidence_is_diverse is true: enough evidence has been collected, stop spending UNI compute"

# ---------------- V2.1: target-free adaptive STOP (docs/WP/WP002.md) ----------------
adaptive:
  min_uni_calls: 4
  max_uni_calls: 32
  information_gain_window: 4
  low_confidence_threshold: 0.15
  spatial_coverage_radius: 0.08
  shortlist_size: 4
  shuffle_seed: 0
  fixed_budgets: [4, 8, 16, 32]
  saturation_thresholds: [0.25, 0.30, 0.35, 0.40, 0.45]   # deterministic baseline; grid scaled to the measured gain range (UNI-space gains plateau ~0.4); chosen per training fold by inner CV
